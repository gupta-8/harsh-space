services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: harshgupta
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SITE_HOST: ${SITE_HOST:-harshgupta.me}
      GITHUB_USER: ${GITHUB_USER:-gupta-8}
      TRACK_QUERY: ${TRACK_QUERY:-carry on wayward son kansas}
    depends_on:
      - mongo

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - api

volumes:
  mongo:
