        <script>
            var d = document.documentElement, m = document.createElement("meta");
            try {
                if (localStorage.getItem("theme") === "dark") d.dataset.theme = "dark";
                if (localStorage.getItem("sound") === "off") d.dataset.sound = "off";
            } catch (e) {}
            m.name = "theme-color";
            m.content = d.dataset.theme ? "#131315" : "#faf8f2";
            document.head.append(m);
        </script>
